<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="improvementGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(16 185 129 / 0.8)" />
      <stop offset="100%" stop-color="rgb(20 184 166 / 0.6)" />
    </linearGradient>
  </defs>
  
  <!-- Main improvement arrow -->
  <path d="M20 80 L100 40" 
        fill="none" 
        stroke="url(#improvementGrad)" 
        stroke-width="4" 
        stroke-linecap="round" />
  
  <!-- Arrow head -->
  <path d="M95 35 L100 40 L95 45" 
        fill="url(#improvementGrad)" 
        stroke="url(#improvementGrad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Starting point -->
  <circle cx="20" cy="80" r="6" fill="rgb(16 185 129 / 0.3)" />
  <circle cx="20" cy="80" r="3" fill="rgb(16 185 129 / 0.8)" />
  
  <!-- End point -->
  <circle cx="100" cy="40" r="6" fill="rgb(20 184 166 / 0.3)" />
  <circle cx="100" cy="40" r="3" fill="rgb(20 184 166 / 0.8)" />
  
  <!-- Progress indicators -->
  <circle cx="40" cy="70" r="2" fill="rgb(16 185 129 / 0.6)" />
  <circle cx="60" cy="60" r="2" fill="rgb(16 185 129 / 0.6)" />
  <circle cx="80" cy="50" r="2" fill="rgb(16 185 129 / 0.6)" />
</svg>
