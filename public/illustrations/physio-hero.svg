<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="motionPath1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgb(16 185 129 / 0.3)" />
      <stop offset="50%" stop-color="rgb(16 185 129 / 0.6)" />
      <stop offset="100%" stop-color="rgb(16 185 129 / 0.3)" />
    </linearGradient>
    <linearGradient id="motionPath2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgb(20 184 166 / 0.3)" />
      <stop offset="50%" stop-color="rgb(20 184 166 / 0.6)" />
      <stop offset="100%" stop-color="rgb(20 184 166 / 0.3)" />
    </linearGradient>
    <linearGradient id="motionPath3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgb(16 185 129 / 0.2)" />
      <stop offset="50%" stop-color="rgb(16 185 129 / 0.5)" />
      <stop offset="100%" stop-color="rgb(16 185 129 / 0.2)" />
    </linearGradient>
  </defs>
  
  <!-- Motion path 1: Gentle stretch arc -->
  <path d="M50 150 Q200 100 350 150" 
        fill="none" 
        stroke="url(#motionPath1)" 
        stroke-width="3" 
        stroke-dasharray="8 4" 
        stroke-linecap="round" />
  
  <!-- Motion path 2: Mobility curve -->
  <path d="M80 200 Q200 120 320 200" 
        fill="none" 
        stroke="url(#motionPath2)" 
        stroke-width="2.5" 
        stroke-dasharray="6 3" 
        stroke-linecap="round" />
  
  <!-- Motion path 3: Subtle movement -->
  <path d="M100 180 Q200 140 300 180" 
        fill="none" 
        stroke="url(#motionPath3)" 
        stroke-width="2" 
        stroke-dasharray="4 2" 
        stroke-linecap="round" />
  
  <!-- Gentle movement indicators -->
  <circle cx="120" cy="130" r="3" fill="rgb(16 185 129 / 0.6)" />
  <circle cx="200" cy="100" r="2.5" fill="rgb(20 184 166 / 0.7)" />
  <circle cx="280" cy="140" r="2" fill="rgb(16 185 129 / 0.5)" />
  
  <!-- Subtle body outline (stylized) -->
  <path d="M180 80 Q200 60 220 80 Q230 100 220 120 Q200 140 180 120 Q170 100 180 80" 
        fill="none" 
        stroke="rgb(16 185 129 / 0.4)" 
        stroke-width="2" 
        stroke-linecap="round" />
  
  <!-- Spine representation -->
  <line x1="200" y1="80" x2="200" y2="120" 
        stroke="rgb(16 185 129 / 0.5)" 
        stroke-width="1.5" 
        stroke-linecap="round" />
  
  <!-- Joint points -->
  <circle cx="200" cy="90" r="2" fill="rgb(16 185 129 / 0.6)" />
  <circle cx="200" cy="100" r="2" fill="rgb(16 185 129 / 0.6)" />
  <circle cx="200" cy="110" r="2" fill="rgb(16 185 129 / 0.6)" />
</svg>
